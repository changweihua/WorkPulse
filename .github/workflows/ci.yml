name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      # 警告棘轮：全仓警告数不得超过 50，超出即失败，防止警告数量回涨
      - name: Lint (oxlint 全仓警告棘轮)
        run: npx oxlint . --max-warnings 50

      - name: Format check (oxfmt)
        run: npm run format:check

      - name: Build
        run: npm run build
