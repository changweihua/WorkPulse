<?xml version="1.0" encoding="UTF-8"?>
<!--
  WorkPulse 主图标（矢量源）
  设计语言：扁平多色填充 + 圆角 + 轻微立体厚度，沿用 iconfont 原图的灰紫/深蓝紫/青/红配色。
  意象：iMac 一体机显示器（呼应「工作空间」）+ 屏幕内脉搏波形（呼应「WorkPulse 工作脉搏」）
        + 顶部四个任务状态点（沿用原图标看板卡片意象）。
  生成派生文件请运行 generate-icons.ps1（依赖 ImageMagick 7）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="256" height="256">
  <defs>
    <linearGradient id="wp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D0D1DC"/>
      <stop offset="1" stop-color="#9B9CAF"/>
    </linearGradient>
    <linearGradient id="wp-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C4F6E"/>
      <stop offset="1" stop-color="#2C2F53"/>
    </linearGradient>
    <linearGradient id="wp-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11CBE5"/>
      <stop offset="0.55" stop-color="#91EDF8"/>
      <stop offset="1" stop-color="#FA4659"/>
    </linearGradient>
  </defs>

  <!-- 支架底座与颈 -->
  <rect x="456" y="666" width="96" height="150" rx="18" fill="#999AAC"/>
  <rect x="336" y="810" width="352" height="58" rx="29" fill="#7C7F95"/>
  <rect x="336" y="800" width="352" height="58" rx="29" fill="#999AAC"/>

  <!-- 显示器厚度（右下偏移，制造立体感） -->
  <rect x="104" y="126" width="832" height="556" rx="52" fill="#7C7F95"/>
  <!-- 显示器主体 -->
  <rect x="88" y="110" width="832" height="556" rx="52" fill="url(#wp-body)"/>
  <!-- 屏幕 -->
  <rect x="140" y="162" width="728" height="452" rx="26" fill="url(#wp-screen)"/>

  <!-- 顶部任务状态点（沿用原图标看板卡片意象，左上高光） -->
  <circle cx="300" cy="252" r="20" fill="#11CBE5"/>
  <circle cx="293" cy="245" r="9" fill="#E9FFF5" opacity="0.92"/>
  <circle cx="392" cy="252" r="20" fill="#BCF4F5"/>
  <circle cx="385" cy="245" r="9" fill="#E9FFF5" opacity="0.92"/>
  <circle cx="484" cy="252" r="20" fill="#FDB8BF"/>
  <circle cx="477" cy="245" r="9" fill="#FEDEE1" opacity="0.92"/>
  <circle cx="576" cy="252" r="20" fill="#FA4659"/>
  <circle cx="569" cy="245" r="9" fill="#FEDEE1" opacity="0.92"/>

  <!-- 脉搏波形：光晕底层 + 渐变主线条 -->
  <path d="M196 470 L292 470 L316 446 L340 470 L388 470 L412 502 L448 352 L484 504 L512 470 L580 470 L608 434 L640 434 L668 470 L812 470"
        fill="none" stroke="#11CBE5" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
  <path d="M196 470 L292 470 L316 446 L340 470 L388 470 L412 502 L448 352 L484 504 L512 470 L580 470 L608 434 L640 434 L668 470 L812 470"
        fill="none" stroke="url(#wp-pulse)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 屏幕底部信息条（沿用原图标横条意象） -->
  <rect x="200" y="540" width="480" height="16" rx="8" fill="#EAEAEE" opacity="0.22"/>

  <!-- 下巴摄像头 -->
  <circle cx="504" cy="636" r="11" fill="#7C7F95"/>
</svg>
