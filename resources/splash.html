<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkPulse · 启动中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        .splash-card {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 40%, #dbeafe 70%, #ede9fe 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "JetBrains Maple Mono", "Maple Mono NF CN", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
            text-align: center;
            overflow: hidden;
        }

        @keyframes bgPulse {
            0% { opacity: 0.9; }
            100% { opacity: 1; }
        }

        .splash-card::before,
        .splash-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: orbFloat 14s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .splash-card::before {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            top: -150px;
            left: -150px;
        }

        .splash-card::after {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #93c5fd, #3b82f6);
            bottom: -120px;
            right: -120px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -50px) scale(1.15); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
            100% { transform: translate(15px, -15px) scale(1.08); }
        }

        .brand-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            animation: iconFloat 3.5s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .brand-icon svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .brand-name {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin-bottom: 2px;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .brand-version {
            font-size: 13px;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-top: 4px;
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 18px;
            position: relative;
            z-index: 1;
        }

        .brand-sub {
            font-size: 14px;
            color: #475569;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6366f1;
            animation: dotWave 1.4s ease-in-out infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotWave {
            0%, 60%, 100% {
                transform: translateY(0) scale(0.8);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-12px) scale(1.2);
                opacity: 1;
                background: #6366f1;
            }
        }

        .status-text {
            margin-top: 24px;
            font-size: 13px;
            color: #475569;
            letter-spacing: 0.5px;
            font-weight: 500;
            animation: statusPulse 2.5s ease-in-out infinite;
            min-height: 18px;
            position: relative;
            z-index: 1;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .ring-decoration {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            border: 1px solid rgba(100, 116, 139, 0.1);
            border-radius: 50%;
            animation: spinSlow 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        .ring-decoration::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px dashed rgba(100, 116, 139, 0.06);
            border-radius: 50%;
        }

        @keyframes spinSlow {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .brand-icon { width: 56px; height: 56px; border-radius: 16px; }
            .brand-icon svg { width: 28px; height: 28px; }
            .brand-name { font-size: 30px; }
            .brand-sub { font-size: 12px; margin-bottom: 24px; }
        }
    </style>
</head>

<body>
    <div class="splash-card" id="splashCard">
        <div class="ring-decoration"></div>

        <div class="brand-icon">
            <svg viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h8" />
            </svg>
        </div>
        <div class="brand-name">WorkPulse</div>
        <div class="brand-version" id="version"></div>
        <div class="brand-sub">工作脉搏 · 高效协同</div>
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="status-text" id="status">正在唤醒工作空间…</div>
    </div>

    <script>
        const env = window.__splash_env__ || {};
        if (env.DEV) console.log('[Splash]', env);

        const isDev = env.DEV === true;

        document.title = 'WorkPulse · 启动中';

        const statusEl = document.getElementById('status');
        if (statusEl) {
            if (isDev) statusEl.textContent = '⚡ 开发模式 · 正在启动…';
            else statusEl.textContent = '🚀 正在唤醒工作空间…';
        }

        const versionEl = document.getElementById('version');
        if (versionEl) {
            const version = env.APP_VERSION || '0.2.26';
            versionEl.textContent = 'v' + version;
        }
    </script>
</body>

</html>
