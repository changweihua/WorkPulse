<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>记了么 · 启动中</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .splash-card {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 40%, #dbeafe 70%, #ede9fe 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family:
          'JetBrains Maple Mono', 'Maple Mono NF CN', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, sans-serif;
        padding: 40px;
        text-align: center;
        overflow: hidden;
      }

      .splash-card::before,
      .splash-card::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.35;
        animation: orbFloat 14s infinite alternate ease-in-out;
        pointer-events: none;
      }

      .splash-card::before {
        width: 500px;
        height: 500px;
        background: linear-gradient(135deg, #91edf8, #11cbe5);
        top: -150px;
        left: -150px;
      }

      .splash-card::after {
        width: 450px;
        height: 450px;
        background: linear-gradient(135deg, #fdb8bf, #fa4659);
        bottom: -120px;
        right: -120px;
        animation-delay: -5s;
      }

      @keyframes orbFloat {
        0% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(40px, -50px) scale(1.15);
        }
        66% {
          transform: translate(-30px, 30px) scale(0.9);
        }
        100% {
          transform: translate(15px, -15px) scale(1.08);
        }
      }

      /* 启动屏品牌图标：「记了么」隶书字标 + 青红脉搏，透明底 */
      .brand-icon {
        width: 300px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        position: relative;
        z-index: 1;
        animation: iconBreathe 2.8s ease-in-out infinite;
        filter: drop-shadow(0 8px 16px rgba(44, 47, 83, 0.2));
      }

      .brand-icon svg {
        width: 100%;
        height: 100%;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes iconBreathe {
        0%,
        100% {
          transform: scale(0.96);
          filter: drop-shadow(0 8px 14px rgba(44, 47, 83, 0.2));
        }
        50% {
          transform: scale(1.04);
          filter: drop-shadow(0 14px 22px rgba(44, 47, 83, 0.3));
        }
      }

      .brand-name {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #0f172a;
        margin-bottom: 2px;
        position: relative;
        z-index: 1;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      .brand-version {
        font-size: 13px;
        color: #64748b;
        letter-spacing: 0.5px;
        margin-top: 4px;
        margin-bottom: 20px;
        font-weight: 500;
        min-height: 18px;
        position: relative;
        z-index: 1;
      }

      .brand-sub {
        font-size: 14px;
        color: #475569;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 32px;
        position: relative;
        z-index: 1;
      }

      .status-text {
        margin-top: 24px;
        font-size: 13px;
        color: #475569;
        letter-spacing: 0.5px;
        font-weight: 500;
        animation: statusPulse 2.5s ease-in-out infinite;
        min-height: 18px;
        position: relative;
        z-index: 1;
      }

      @keyframes statusPulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      .ring-decoration {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 80px;
        height: 80px;
        border: 1px solid rgba(100, 116, 139, 0.1);
        border-radius: 50%;
        animation: spinSlow 20s linear infinite;
        pointer-events: none;
        z-index: 0;
      }

      .ring-decoration::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        bottom: 8px;
        border: 1px dashed rgba(100, 116, 139, 0.06);
        border-radius: 50%;
      }

      @keyframes spinSlow {
        to {
          transform: rotate(360deg);
        }
      }

      /* 减少动态偏好：启动屏只保留静态视觉，避免持续动画 */
      @media (prefers-reduced-motion: reduce) {
        .splash-card::before,
        .splash-card::after,
        .brand-icon,
        .status-text,
        .ring-decoration {
          animation: none !important;
        }
      }

      @media (max-width: 480px) {
        .brand-icon {
          width: 220px;
          height: 62px;
        }
        .brand-icon svg {
          width: 100%;
          height: 100%;
        }
        .brand-name {
          font-size: 30px;
        }
        .brand-sub {
          font-size: 12px;
          margin-bottom: 24px;
        }
      }
    </style>
  </head>

    <script>
      const env = window.__splash_env__ || {};
      if (env.DEV) console.log('[Splash]', env);

      const isDev = env.DEV === true;

      document.title = '记了么 · 启动中';

      const statusEl = document.getElementById('status');
      if (statusEl) {
        if (isDev) statusEl.textContent = '⚡ 开发模式 · 正在启动…';
        else statusEl.textContent = '🚀 正在唤醒工作空间…';
      }

      const versionEl = document.getElementById('version');
      if (versionEl) {
        const version = env.APP_VERSION || '0.3.13';
        versionEl.textContent = 'v' + version;
      }
    </script>
