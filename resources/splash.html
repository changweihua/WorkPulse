<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkPulse · 启动中</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .splash-card {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 40%, #dbeafe 70%, #ede9fe 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family:
          'JetBrains Maple Mono', 'Maple Mono NF CN', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, sans-serif;
        padding: 40px;
        text-align: center;
        overflow: hidden;
      }

      @keyframes bgPulse {
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 1;
        }
      }

      .splash-card::before,
      .splash-card::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.35;
        animation: orbFloat 14s infinite alternate ease-in-out;
        pointer-events: none;
      }

      .splash-card::before {
        width: 500px;
        height: 500px;
        background: linear-gradient(135deg, #91edf8, #11cbe5);
        top: -150px;
        left: -150px;
      }

      .splash-card::after {
        width: 450px;
        height: 450px;
        background: linear-gradient(135deg, #fdb8bf, #fa4659);
        bottom: -120px;
        right: -120px;
        animation-delay: -5s;
      }

      @keyframes orbFloat {
        0% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(40px, -50px) scale(1.15);
        }
        66% {
          transform: translate(-30px, 30px) scale(0.9);
        }
        100% {
          transform: translate(15px, -15px) scale(1.08);
        }
      }

      /* 启动屏品牌图标：沿用主程序图标的多色显示器 + 脉搏造型，圆角毛玻璃底座 */
      .brand-icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: linear-gradient(145deg, #ffffff 0%, #eef0f7 100%);
        border: 1px solid rgba(255, 255, 255, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        box-shadow:
          0 10px 34px rgba(44, 47, 83, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        position: relative;
        z-index: 1;
        animation: iconBreathe 2.8s ease-in-out infinite;
      }

      .brand-icon svg {
        width: 58px;
        height: 58px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes iconBreathe {
        0%,
        100% {
          transform: scale(0.96);
          box-shadow:
            0 8px 26px rgba(44, 47, 83, 0.14),
            inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        50% {
          transform: scale(1.04);
          box-shadow:
            0 14px 44px rgba(44, 47, 83, 0.26),
            inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
      }

      .brand-name {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #0f172a;
        margin-bottom: 2px;
        position: relative;
        z-index: 1;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      .brand-version {
        font-size: 13px;
        color: #64748b;
        letter-spacing: 0.5px;
        margin-top: 4px;
        margin-bottom: 20px;
        font-weight: 500;
        min-height: 18px;
        position: relative;
        z-index: 1;
      }

      .brand-sub {
        font-size: 14px;
        color: #475569;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 32px;
        position: relative;
        z-index: 1;
      }

      .status-text {
        margin-top: 24px;
        font-size: 13px;
        color: #475569;
        letter-spacing: 0.5px;
        font-weight: 500;
        animation: statusPulse 2.5s ease-in-out infinite;
        min-height: 18px;
        position: relative;
        z-index: 1;
      }

      @keyframes statusPulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      .ring-decoration {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 80px;
        height: 80px;
        border: 1px solid rgba(100, 116, 139, 0.1);
        border-radius: 50%;
        animation: spinSlow 20s linear infinite;
        pointer-events: none;
        z-index: 0;
      }

      .ring-decoration::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        bottom: 8px;
        border: 1px dashed rgba(100, 116, 139, 0.06);
        border-radius: 50%;
      }

      @keyframes spinSlow {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .brand-icon {
          width: 72px;
          height: 72px;
          border-radius: 18px;
        }
        .brand-icon svg {
          width: 48px;
          height: 48px;
        }
        .brand-name {
          font-size: 30px;
        }
        .brand-sub {
          font-size: 12px;
          margin-bottom: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="splash-card" id="splashCard">
      <div class="ring-decoration"></div>

      <div class="brand-icon">
        <!-- 与主程序图标同源：多色显示器 + 脉搏波形 + 任务状态点 -->
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sp-screen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4C4F6E" />
              <stop offset="1" stop-color="#2C2F53" />
            </linearGradient>
            <linearGradient id="sp-pulse" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#11CBE5" />
              <stop offset="0.55" stop-color="#91EDF8" />
              <stop offset="1" stop-color="#FA4659" />
            </linearGradient>
          </defs>
          <!-- 支架 -->
          <rect x="456" y="666" width="96" height="150" rx="18" fill="#999AAC" />
          <rect x="336" y="812" width="352" height="56" rx="28" fill="#7C7F95" />
          <rect x="336" y="802" width="352" height="56" rx="28" fill="#999AAC" />
          <!-- 显示器厚度与主体 -->
          <rect x="104" y="126" width="832" height="556" rx="52" fill="#7C7F95" />
          <rect x="88" y="110" width="832" height="556" rx="52" fill="#CACAD4" />
          <!-- 屏幕 -->
          <rect x="140" y="162" width="728" height="452" rx="26" fill="url(#sp-screen)" />
          <!-- 任务状态点 -->
          <circle cx="300" cy="252" r="22" fill="#11CBE5" />
          <circle cx="293" cy="244" r="10" fill="#E9FFF5" opacity="0.92" />
          <circle cx="392" cy="252" r="22" fill="#BCF4F5" />
          <circle cx="385" cy="244" r="10" fill="#E9FFF5" opacity="0.92" />
          <circle cx="484" cy="252" r="22" fill="#FDB8BF" />
          <circle cx="477" cy="244" r="10" fill="#FEDEE1" opacity="0.92" />
          <circle cx="576" cy="252" r="22" fill="#FA4659" />
          <circle cx="569" cy="244" r="10" fill="#FEDEE1" opacity="0.92" />
          <!-- 脉搏波形 -->
          <path
            d="M196 470 L292 470 L316 446 L340 470 L388 470 L412 502 L448 352 L484 504 L512 470 L580 470 L608 434 L640 434 L668 470 L812 470"
            fill="none"
            stroke="#11CBE5"
            stroke-width="44"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.18"
          />
          <path
            d="M196 470 L292 470 L316 446 L340 470 L388 470 L412 502 L448 352 L484 504 L512 470 L580 470 L608 434 L640 434 L668 470 L812 470"
            fill="none"
            stroke="url(#sp-pulse)"
            stroke-width="20"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <!-- 底部信息条与摄像头 -->
          <rect x="200" y="540" width="480" height="16" rx="8" fill="#EAEAEE" opacity="0.22" />
          <circle cx="504" cy="636" r="11" fill="#7C7F95" />
        </svg>
      </div>
      <div class="brand-name">WorkPulse</div>
      <div class="brand-version" id="version"></div>
      <div class="brand-sub">工作脉搏 · 高效协同</div>
      <div class="status-text" id="status">正在唤醒工作空间…</div>
    </div>

    <script>
      const env = window.__splash_env__ || {};
      if (env.DEV) console.log('[Splash]', env);

      const isDev = env.DEV === true;

      document.title = 'WorkPulse · 启动中';

      const statusEl = document.getElementById('status');
      if (statusEl) {
        if (isDev) statusEl.textContent = '⚡ 开发模式 · 正在启动…';
        else statusEl.textContent = '🚀 正在唤醒工作空间…';
      }

      const versionEl = document.getElementById('version');
      if (versionEl) {
        const version = env.APP_VERSION || '0.3.12';
        versionEl.textContent = 'v' + version;
      }
    </script>
  </body>
</html>
